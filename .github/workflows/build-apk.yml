name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.7.2)'
        required: false
        default: 'v2.7.2'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Zoya AI Companion - Android Release v2.7.2'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug & Universal)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Zoya-AI-Companion-v2.7.2.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Zoya-AI-Companion-latest.apk
          ls -la release-artifacts

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoya-AI-Companion-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v2.7.2"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Zoya AI Voice Companion - Android APK (${{ steps.tag_info.outputs.tag }})
          body: |
            ## 🌸 Zoya AI Voice Companion - Android APK Release

            Welcome to the official Android build for **Zoya AI Voice Companion**!

            ### 📱 What's Included:
            - **Native Android APK**: Direct one-tap installation on Android phones and tablets.
            - **Microphone & Full Duplex Audio**: Ultra-fast live voice conversation with Kore (मोहिनी) / Aoede (सुरीली) Indian female voices.
            - **Premium UI Overhaul**: Holographic audio presence, live conversation transcript stream, responsive controls, and customizable personality.
            - **Background Audio Support & Wake Lock**: Keeps conversation alive without premature sleep.

            ### 🚀 Installation Guide:
            1. Download `Zoya-AI-Companion-v2.7.2.apk` (or `Zoya-AI-Companion-latest.apk`) below.
            2. Open the file on your Android device.
            3. If prompted, allow "Install from Unknown Sources".
            4. Grant Microphone permission when prompted, and enjoy chatting with Zoya!

            ---
            *Built automatically with GitHub Actions & Capacitor.*
          files: |
            release-artifacts/Zoya-AI-Companion-v2.7.2.apk
            release-artifacts/Zoya-AI-Companion-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
